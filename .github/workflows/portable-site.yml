name: Portable site
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core-mayhem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core-mayhem/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Formatting (existing baseline is advisory)
        continue-on-error: true
        run: npm run format
      - run: npm run test:coverage
      - run: npm run build:portable
      - name: Verify music-free output
        run: node --input-type=module -e "import {readdirSync,readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; assert.deepEqual(readdirSync('dist/assets/music'), ['playlist.json']); assert.deepEqual(JSON.parse(readFileSync('dist/assets/music/playlist.json','utf8')), []);"
      - name: Include deployment instructions
        run: cp docs/RELEASE_PROCESS.md dist/DEPLOYMENT.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-mayhem-site
          path: core-mayhem/dist/
          if-no-files-found: error
          retention-days: 30
