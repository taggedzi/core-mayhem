name: Feature request
description: Suggest an improvement to gameplay, controls, or development tools.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the player or developer need and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature would work. A small example helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or other approaches, if any.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Attach sketches, screenshots, or examples if useful.
