<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Mayhem</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- C3: noscript style applied when JS is disabled; the notice itself is in <body> -->
    <noscript><style>
      #noscript-notice {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #05070a; color: #e6f0ff;
        font-family: Verdana, sans-serif; font-size: 16px; text-align: center;
        padding: 24px; z-index: 9999;
      }
    </style></noscript>
  </head>
  <body>
    <!-- C3: visible only when JavaScript is disabled (noscript style defined in head) -->
    <noscript>
      <div id="noscript-notice">
        Core Mayhem requires JavaScript.<br>
        Please enable JavaScript and use a modern browser
        (Chrome 80+, Firefox 74+, Safari 13.1+, Edge 79+).
      </div>
    </noscript>
    <header>
      <div class="left">
        <button id="btnHelp" title="Show dev hotkeys (H)">Help</button>
        <span class="brand">CORE MAYHEM</span>
      </div>
      <div id="score" class="scoreboard"></div>
      <div class="right">
        <button id="btnStart">▶ Start</button>
        <button id="btnStop" disabled>■ Stop</button>
        <button id="btnStats" title="Open stats panel">📊 Stats</button>
        <span class="pill-state"><span class="tag">State</span> <span id="state">Idle</span></span>
        <span class="pill-state"><span class="tag">FPS</span> <span id="fps">0</span></span>
        <button id="btnAudio" title="Audio settings">🔊 Audio</button>
        <button id="btnBanter" title="Banter settings">💬 Banter</button>
        <button id="btnChars" title="Character settings">🎭 Characters</button>
      </div>
    </header>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="banterL" class="banter left"></div>
      <div id="banterR" class="banter right"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
